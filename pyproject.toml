[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codemedic"
version = "0.1.0"
description = "Multi-Agent Code Diagnosis and Repair System based on LangChain and LangGraph"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "CodeMedic Contributors" },
]
dependencies = [
    "langchain==1.3.13",
    "langgraph==1.2.9",
    "langchain-openai==1.3.5",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "unidiff>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<0.16",
    "mypy>=2,<3",
]
streamlit = [
    "streamlit>=1.36,<2",
]

[tool.setuptools.packages.find]
include = ["codemedic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["demo_repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
